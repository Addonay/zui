# CI: native tests, required compile-only cross-target checks, and a native
# Linux AccessKit configuration gate. Cross-target AccessKit remains outside
# this workflow until the platform adapters are implemented.
#
# Toolchain is pinned to the exact tested revision via the download index
# (see docs/PLATFORM_MATRIX.md). Cross-target jobs are compile-only
# (`zig build check` never executes binaries) and are REQUIRED: the default
# configuration compiles for both targets (fixed 2026-09-18). The Linux
# `-Daccesskit=true` job is required for the native bridge. It does
# not claim Windows/macOS AccessKit support; those remain explicit gaps.

name: ci

on:
  push:
  pull_request:

env:
  # Exact tested compiler; keep in sync with README.md and build.zig.zon.
  ZIG_VERSION: 0.17.0-dev.2151+2ec5523d5

jobs:
  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Zig
        run: |
          curl -s https://ziglang.org/download/index.json -o /tmp/zig-index.json
          URL=$(python3 -c "import json; print(json.load(open('/tmp/zig-index.json'))['master']['x86_64-linux']['tarball'])")
          curl -L "$URL" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: Toolchain
        run: zig version
      - name: Native tests (unit + headless selftests)
        run: zig build test --summary all
      - name: External package smoke test
        run: zig build smoke --summary all

  zlay-parity:
    name: Zlay vs pinned Taffy oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Zig + Rust
        run: |
          curl -s https://ziglang.org/download/index.json -o /tmp/zig-index.json
          URL=$(python3 -c "import json; print(json.load(open('/tmp/zig-index.json'))['master']['x86_64-linux']['tarball'])")
          curl -L "$URL" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: External layout oracle
        run: bash tools/run-zlay-parity.sh

  check-windows:
    # Required: the default configuration compiles for Windows (compile-only).
    name: check (x86_64-windows-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Zig
        run: |
          curl -s https://ziglang.org/download/index.json -o /tmp/zig-index.json
          URL=$(python3 -c "import json; print(json.load(open('/tmp/zig-index.json'))['master']['x86_64-linux']['tarball'])")
          curl -L "$URL" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: Compile-only check (never executes)
        run: zig build check -Dtarget=x86_64-windows-gnu --summary all

  check-macos:
    # Required: the default configuration compiles for macOS (compile-only).
    name: check (aarch64-macos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Zig
        run: |
          curl -s https://ziglang.org/download/index.json -o /tmp/zig-index.json
          URL=$(python3 -c "import json; print(json.load(open('/tmp/zig-index.json'))['master']['x86_64-linux']['tarball'])")
          curl -L "$URL" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: Compile-only check (never executes)
        run: zig build check -Dtarget=aarch64-macos --summary all

  accesskit-linux:
    # Required feature gate: the vendored AccessKit build must stay green on
    # Linux while the Windows/macOS AccessKit configurations are not yet
    # supported (they are not exercised here; see docs/A11Y_PLAN.md).
    name: native tests (-Daccesskit=true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Zig + Rust
        run: |
          curl -s https://ziglang.org/download/index.json -o /tmp/zig-index.json
          URL=$(python3 -c "import json; print(json.load(open('/tmp/zig-index.json'))['master']['x86_64-linux']['tarball'])")
          curl -L "$URL" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Native tests with AccessKit enabled
        run: zig build test -Daccesskit=true --summary all
