name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  ZIG_VERSION: 0.17.0
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
      - name: Install software Vulkan and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers fonts-dejavu-core
      - name: Compile everything
        run: zig build check --summary line
      - name: Tests
        run: |
          # The GPU tests skip without Vulkan 1.3, so a missing driver must fail here.
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -n "$VK_ICD_FILENAMES"
          zig build test --summary line
      - name: Snapshot an example
        run: |
          ZUI_HEADLESS=1 ZUI_SNAPSHOT=hello.ppm zig build run-hello_world
          test -s hello.ppm

  cross-check:
    # Compile only: these platforms are not ported yet, but the shared code must stay portable.
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-windows-gnu, aarch64-macos, aarch64-linux-gnu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
        with:
          cache-key: ${{ matrix.target }}
      - name: Compile everything
        run: zig build check -Dtarget=${{ matrix.target }} --summary line
