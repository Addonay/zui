name: Set up Zig
description: Installs the stable Zig named by ZIG_VERSION and caches fetched packages and compiled C libraries.

inputs:
  cache-key:
    description: Keeps matrix jobs from sharing one cache entry.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Zig
      shell: bash
      run: |
        curl -fsSL --retry 3 "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
        echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
        mkdir -p "$HOME/zig"
        tar -xf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
        echo "$HOME/zig" >> "$GITHUB_PATH"
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/zig
          zig-pkg
        key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}-${{ github.job }}-${{ inputs.cache-key }}-${{ hashFiles('build.zig.zon') }}
        restore-keys: |
          zig-${{ env.ZIG_VERSION }}-${{ runner.os }}-${{ github.job }}-${{ inputs.cache-key }}-
